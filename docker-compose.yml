version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: ebook2latex_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ebook2latex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ebook2latex_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ebook2latex_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebook2latex"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    container_name: ebook2latex_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ebook2latex}:${POSTGRES_PASSWORD:-ebook2latex_pass}@db:5432/${POSTGRES_DB:-ebook2latex_db}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey_change_in_production}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    command: >
      sh -c "alembic upgrade head &&
             python seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    container_name: ebook2latex_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
